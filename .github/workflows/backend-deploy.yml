name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger (for manual seed or redeploy)

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🧩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧠 Verify Railway DB Connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "🔍 Testing Railway DB Connection..."
          npx prisma db pull || { echo "❌ Failed to connect to Railway DB"; exit 1; }
          echo "✅ Successfully connected to Railway DB"

      - name: 🗃️ Run Prisma Migrations (Safe Deploy)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          echo "🚀 Running Prisma migrations..."
          npx prisma migrate deploy || { echo "❌ Migration failed"; exit 1; }

          # Optional seed logic
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "⚙️ Manual workflow detected – running seed for controlled refresh..."
            if [ -f "prisma/seed.js" ]; then
              node prisma/seed.js || echo "ℹ️ Seed script failed or skipped"
            else
              echo "ℹ️ No seed.js found, skipping seed step."
            fi
          else
            echo "🛡️ Auto deploy detected – skipping seed step"
          fi

          echo "✅ Migration (and optional seed) completed successfully"

      - name: 🌐 Trigger Render Deployment
        if: success()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
        run: |
          echo "🚀 Triggering Render deploy..."
          response=$(curl -s -o response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -d '')
          if [ "$response" -ge 400 ]; then
            echo "❌ Render deploy trigger failed with HTTP $response"
            cat response.json
            exit 1
          fi
          echo "✅ Render deploy triggered successfully"

      - name: ⏳ Wait for Backend to be Live
        run: |
          echo "⏳ Waiting for backend to go live..."
          ATTEMPTS=0
          until curl -s --head --fail https://runnercityhousing-backend.onrender.com > /dev/null; do
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -ge 20 ]; then
              echo "❌ Backend not responding after 20 attempts"
              exit 1
            fi
            echo "Backend not ready yet... retrying in 10s"
            sleep 10
          done
          echo "✅ Backend is live and responding!"
